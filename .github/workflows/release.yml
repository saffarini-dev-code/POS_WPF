name: Production Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version
        required: true
        default: '1.0.0'
      ref:
        description: Source branch or tag to publish
        required: true
        default: 'ci-production'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
            $ref = '${{ github.ref_name }}'
          } else {
            $version = '${{ inputs.version }}'
            $ref = '${{ inputs.ref }}'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore POS_WPF.sln

      - name: Build
        run: dotnet build POS_WPF.sln --configuration Release --no-restore

      - name: Business verification
        run: dotnet run --project src/POS_WPF/POS_WPF.csproj --configuration Release --no-build -- --verify

      - name: Publish
        run: dotnet publish src/POS_WPF/POS_WPF.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.meta.outputs.version }} --output artifacts/POS_WPF-${{ steps.meta.outputs.version }}

      - name: Package
        shell: pwsh
        run: |
          $dir = "artifacts/POS_WPF-${{ steps.meta.outputs.version }}"
          if (-not (Test-Path "$dir/POS_WPF.exe")) { throw 'Production executable was not generated.' }
          $sha = (Get-FileHash "$dir/POS_WPF.exe" -Algorithm SHA256).Hash
          "$sha  POS_WPF.exe" | Set-Content "$dir/SHA256SUMS.txt"
          @{
            version='${{ steps.meta.outputs.version }}'
            commit='${{ github.sha }}'
            runtime='win-x64'
            selfContained=$true
            verification='passed'
          } | ConvertTo-Json | Set-Content "$dir/BUILD-METADATA.json"
          Compress-Archive -Path "$dir/*" -DestinationPath "artifacts/POS_WPF-${{ steps.meta.outputs.version }}-win-x64.zip"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS_WPF-${{ steps.meta.outputs.version }}-win-x64
          path: artifacts/POS_WPF-${{ steps.meta.outputs.version }}-win-x64.zip
          if-no-files-found: error
