name: Production Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore POS_WPF.sln
      - name: Build
        run: dotnet build POS_WPF.sln --configuration Release --no-restore
      - name: Business verification
        run: dotnet run --project src/POS_WPF/POS_WPF.csproj --configuration Release --no-build -- --verify
      - name: Publish
        run: dotnet publish src/POS_WPF/POS_WPF.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ inputs.version }} --output artifacts/POS_WPF-${{ inputs.version }}
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/POS_WPF-${{ inputs.version }}/* -DestinationPath artifacts/POS_WPF-${{ inputs.version }}-win-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS_WPF-${{ inputs.version }}-win-x64
          path: artifacts/POS_WPF-${{ inputs.version }}-win-x64.zip
