name: Cleanup temporary POS patch workflows

on:
  push:
    branches: [ ci-production ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci-production
          fetch-depth: 0

      - name: Remove temporary workflows
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-pos-aggregate-tax-fix.yml .github/workflows/finalize-pos-fix.yml .github/workflows/cleanup-pos-patch-workflows.yml
          git commit -m "Remove temporary POS patch workflows"
          git push origin HEAD:ci-production
