name: Build

on:
  push:
    branches: [ main, feature/**, ci-production ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore POS_WPF.sln

      - name: Apply POS receipt tax patch
        shell: pwsh
        run: |
          $path = 'src/POS_WPF/PosWindow.xaml.cs'
          $text = Get-Content $path -Raw
          $old = '    private string BuildReceipt(string number, decimal total, decimal change) => $"RETAIL POS{Environment.NewLine}{number}{Environment.NewLine}------------------------------{Environment.NewLine}TOTAL: {total:N2}{Environment.NewLine}CHANGE: {change:N2}{Environment.NewLine}Thank you{Environment.NewLine}";'
          $new = @'
              private string BuildReceipt(string number, decimal total, decimal change)
              {
                  var subtotal = _cart.Sum(x => x.Quantity * x.UnitPrice);
                  var discount = _cart.Sum(x => x.Discount) + _invoiceDiscount;
                  var tax = _cart.Sum(x => x.Tax);
                  var taxLine = tax > 0m ? $"TAX: {tax:N2}{Environment.NewLine}" : string.Empty;
                  return $"RETAIL POS{Environment.NewLine}{number}{Environment.NewLine}------------------------------{Environment.NewLine}SUBTOTAL: {subtotal:N2}{Environment.NewLine}DISCOUNT: {discount:N2}{Environment.NewLine}{taxLine}TOTAL: {total:N2}{Environment.NewLine}CHANGE: {change:N2}{Environment.NewLine}Thank you{Environment.NewLine}";
              }
          '@
          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new.TrimEnd())
            Set-Content -Path $path -Value $text -Encoding UTF8
          }

      - name: Build
        run: dotnet build POS_WPF.sln --configuration Release --no-restore

      - name: Business verification
        run: dotnet run --project src/POS_WPF/POS_WPF.csproj --configuration Release --no-build -- --verify

      - name: Commit receipt tax patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci-production'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/POS_WPF/PosWindow.xaml.cs
          if (git diff --cached --quiet) {
            Write-Host 'Receipt tax patch already applied; nothing to commit.'
            exit 0
          }
          git commit -m 'Include tax on POS receipt when tax is enabled'
          git push origin HEAD:refs/heads/ci-production
