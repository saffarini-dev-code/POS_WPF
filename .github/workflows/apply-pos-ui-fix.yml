name: Apply POS UI Fix

on:
  push:
    branches: [ ci-production ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'ci: apply POS UI fix'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci-production
          fetch-depth: 0

      - name: Apply POS layout and tax visibility fixes
        shell: pwsh
        run: |
          $xamlPath = 'src/POS_WPF/PosWindow.xaml'
          $xaml = Get-Content -Raw -Encoding UTF8 $xamlPath

          $newPaymentPanel = @'
                    <Grid Grid.Row="3" Margin="12,10,12,10">
                        <Grid.ColumnDefinitions>
                            <ColumnDefinition Width="*"/>
                            <ColumnDefinition Width="188"/>
                        </Grid.ColumnDefinitions>

                        <Border Grid.Column="0" Background="#FFFFFF" BorderBrush="#E2E8F0" BorderThickness="1" CornerRadius="5" Padding="10" Margin="0,0,8,0">
                            <Grid>
                                <Grid.RowDefinitions>
                                    <RowDefinition Height="Auto"/>
                                    <RowDefinition Height="Auto"/>
                                    <RowDefinition Height="Auto"/>
                                    <RowDefinition Height="*"/>
                                    <RowDefinition Height="Auto"/>
                                </Grid.RowDefinitions>

                                <TextBlock Grid.Row="0" Text="PAYMENT" FontSize="10" Foreground="#94A3B8" FontWeight="SemiBold" Margin="0,0,0,7"/>
                                <UniformGrid Grid.Row="1" Columns="3" Margin="0,0,0,8">
                                    <Button x:Name="CardButton" Content="▣  Card" Tag="Card" Height="42" Margin="0,0,5,0" Style="{StaticResource PayButtonStyle}" Click="PaymentMethod_Click"/>
                                    <Button x:Name="CashButton" Content="▤  Cash" Tag="Cash" Height="42" Margin="0,0,5,0" Style="{StaticResource PayButtonStyle}" Click="PaymentMethod_Click"/>
                                    <Button x:Name="MobileButton" Content="▥  Mobile" Tag="Mobile" Height="42" Style="{StaticResource PayButtonStyle}" Click="PaymentMethod_Click"/>
                                </UniformGrid>

                                <TextBlock Grid.Row="2" Text="AMOUNT RECEIVED" FontSize="9" Foreground="#94A3B8" Margin="0,0,0,3"/>
                                <Grid Grid.Row="3">
                                    <Grid.RowDefinitions>
                                        <RowDefinition Height="44"/>
                                        <RowDefinition Height="Auto"/>
                                        <RowDefinition Height="Auto"/>
                                    </Grid.RowDefinitions>
                                    <TextBox x:Name="PaymentBox" Grid.Row="0" Text="0.00" Height="44" FontSize="20" FontWeight="Bold" TextAlignment="Right" VerticalContentAlignment="Center" GotKeyboardFocus="KeypadTarget_GotKeyboardFocus" TextChanged="PaymentBox_TextChanged"/>
                                    <StackPanel Grid.Row="1" Orientation="Horizontal" Margin="0,6,0,0">
                                        <TextBlock Text="Change" FontSize="10" Foreground="#94A3B8" VerticalAlignment="Center"/>
                                        <TextBlock x:Name="ChangeText" Text="0.00" FontSize="14" FontWeight="Bold" Foreground="#16A34A" Margin="8,0,0,0"/>
                                    </StackPanel>
                                    <Button Grid.Row="2" Content="▣  CHARGE" Height="44" Margin="0,10,0,0" Click="Complete_Click" Background="#20A64A" Foreground="White" BorderBrush="#20A64A" Style="{StaticResource BaseButton}"/>
                                </Grid>

                                <TextBlock x:Name="StatusText" Grid.Row="4" Text="Ready" FontSize="10" Foreground="#64748B" Margin="0,8,0,0" TextTrimming="CharacterEllipsis"/>
                            </Grid>
                        </Border>

                        <Grid Grid.Column="1">
                            <Grid.RowDefinitions>
                                <RowDefinition Height="*"/>
                                <RowDefinition Height="48"/>
                            </Grid.RowDefinitions>

                            <Border Grid.Row="0" Background="#F6F8FB" BorderBrush="#DCE2EA" BorderThickness="1" CornerRadius="5" Padding="4">
                                <UniformGrid Rows="4" Columns="3">
                                    <Button Tag="7" Content="7" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="8" Content="8" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="9" Content="9" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="4" Content="4" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="5" Content="5" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="6" Content="6" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="1" Content="1" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="2" Content="2" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="3" Content="3" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="." Content="." Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Tag="0" Content="0" Style="{StaticResource TouchKeyStyle}" Click="Keypad_Click"/>
                                    <Button Content="⌫" Style="{StaticResource TouchKeyStyle}" Click="KeypadBackspace_Click"/>
                                </UniformGrid>
                            </Border>

                            <Grid Grid.Row="1" Margin="0,7,0,0">
                                <Grid.ColumnDefinitions>
                                    <ColumnDefinition Width="*"/>
                                    <ColumnDefinition Width="*"/>
                                </Grid.ColumnDefinitions>
                                <Button Grid.Column="0" Content="Hold" Height="42" Margin="0,0,4,0" Click="Hold_Click" Style="{StaticResource BaseButton}"/>
                                <Button Grid.Column="1" Content="Recall" Height="42" Margin="4,0,0,0" Click="Recall_Click" Style="{StaticResource BaseButton}"/>
                            </Grid>
                        </Grid>
                    </Grid>
'@

          $pattern = '(?s)<Grid Grid.Row="3" Margin="12,10,12,10">.*?\n                </Grid>\r?\n            </Border>'
          $updated = [regex]::Replace($xaml, $pattern, $newPaymentPanel.TrimEnd() + "`r`n            </Border>", 1)
          if ($updated -eq $xaml) { throw 'POS payment panel block was not found; refusing to modify the file.' }

          $updated = $updated.Replace('<TextBlock Grid.Row="3" Text="Tax" Foreground="#64748B" Style="{StaticResource ZeroHiddenText}"/>', '<TextBlock x:Name="TaxLabel" Grid.Row="3" Text="Tax" Foreground="#64748B" Visibility="Collapsed"/>')
          Set-Content -Path $xamlPath -Value $updated -Encoding utf8NoBOM

          $csPath = 'src/POS_WPF/PosWindow.xaml.cs'
          $cs = Get-Content -Raw -Encoding UTF8 $csPath
          $old = '        ReceiptTaxText.Text = tax.ToString("N2", CultureInfo.CurrentCulture);'
          $new = @'
        ReceiptTaxText.Text = tax.ToString("N2", CultureInfo.CurrentCulture);
        var showTax = tax > 0m;
        TaxLabel.Visibility = showTax ? Visibility.Visible : Visibility.Collapsed;
        TaxText.Visibility = showTax ? Visibility.Visible : Visibility.Collapsed;
'@
          if (-not $cs.Contains($old)) { throw 'RefreshTotal tax assignment was not found; refusing to modify the code-behind.' }
          $cs = $cs.Replace($old, $new.TrimEnd())
          Set-Content -Path $csPath -Value $cs -Encoding utf8NoBOM

      - name: Restore
        run: dotnet restore POS_WPF.sln

      - name: Build
        run: dotnet build POS_WPF.sln --configuration Release --no-restore

      - name: Commit verified changes and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/POS_WPF/PosWindow.xaml src/POS_WPF/PosWindow.xaml.cs
          git rm .github/workflows/apply-pos-ui-fix.yml
          git commit -m 'ci: apply POS UI fix'
          git push origin ci-production
